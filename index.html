<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f2" />
    <title>学習ログ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">MY STUDY JOURNAL</p>
            <h1 id="app-title">学習ログ</h1>
            <p class="intro-copy">今日の学びを、ひとつずつ記録しよう。</p>
          </div>
          <div class="save-state" id="save-state" aria-live="polite">入力待ち</div>
        </div>

        <form id="study-form" class="study-form">
          <label class="field-label" for="entry-date">学習した日</label>
          <input id="entry-date" name="date" type="date" required />

          <label class="field-label" for="entry-subject">学習したこと</label>
          <input
            id="entry-subject"
            name="subject"
            type="text"
            maxlength="60"
            placeholder="例：英語、数学、プログラミング"
            required
          />

          <label class="field-label" for="entry-minutes">学習時間</label>
          <div class="duration-input">
            <input id="entry-minutes" name="minutes" type="number" min="1" max="1440" step="1" placeholder="30" required />
            <span>分</span>
          </div>

          <label class="field-label" for="entry-note">学んだこと・気づき <span class="optional-label">任意</span></label>
          <textarea
            id="entry-note"
            name="note"
            rows="5"
            maxlength="240"
            placeholder="できるようになったことや、次に取り組みたいこと"
          ></textarea>
          <div class="note-meta">
            <span id="editing-label">新しい学習記録</span>
            <span><span id="char-count">0</span>/240</span>
          </div>

          <div class="privacy-note">名前・住所・学校名などの個人情報は入力しないでください。</div>

          <div class="action-row">
            <button class="primary-button" type="submit">学習記録を保存</button>
            <button class="ghost-button" type="button" id="clear-button">入力をリセット</button>
          </div>
        </form>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-header">
          <div>
            <p class="eyebrow">YOUR PROGRESS</p>
            <h2 id="history-title">学習の記録</h2>
          </div>
          <p class="history-caption">積み重ねが、次の一歩になる。</p>
        </div>

        <section class="progress-panel" aria-labelledby="progress-title">
          <div class="progress-heading">
            <div>
              <p class="section-label" id="progress-title">これまでの学習</p>
              <p class="progress-caption">記録した学習の合計</p>
            </div>
            <span class="progress-mark" aria-hidden="true">✦</span>
          </div>
          <div class="stats-row">
            <div class="stat-card">
              <strong id="total-minutes">0</strong>
              <span>合計分</span>
            </div>
            <div class="stat-card">
              <strong id="study-days">0</strong>
              <span>学習した日</span>
            </div>
            <div class="stat-card">
              <strong id="entry-count">0</strong>
              <span>記録の数</span>
            </div>
          </div>
          <div class="summary-row" id="summary-row" aria-label="教科ごとの学習時間"></div>
        </section>

        <div class="list-tools">
          <label class="search-box" for="search-input">
            <span>記録を検索</span>
            <input id="search-input" type="search" placeholder="教科やメモから探す" />
          </label>
          <select id="subject-filter" aria-label="学習内容で絞り込み">
            <option value="all">すべての学習</option>
          </select>
        </div>

        <div id="empty-state" class="empty-state">
          <span class="empty-mark" aria-hidden="true">✎</span>
          <strong>学習記録はまだありません</strong>
          <span>今日取り組んだことを記録してみましょう。</span>
        </div>

        <ul id="entry-list" class="entry-list" aria-label="保存した学習記録"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
